<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecdc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Game Night</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%23f5b800' stroke='%231d1a16' stroke-width='4'/%3E%3Ccircle cx='22' cy='22' r='5' fill='%231d1a16'/%3E%3Ccircle cx='42' cy='42' r='5' fill='%231d1a16'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%231d1a16'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main class="hub">
    <button class="btn ghost sm lang-btn home-lang" data-action="lang"></button>

    <header class="hub-head">
      <div class="dice" aria-hidden="true"><i class="die d1"></i><i class="die d2"></i></div>
      <h1 class="hub-logo">Game<span>night</span></h1>
      <p class="tagline" data-t="tagline"></p>
    </header>

    <section class="games" id="games">
      <a class="game-card uno" href="/uno/">
        <div class="art" aria-hidden="true"><i class="uc r"></i><i class="uc y"></i><i class="uc g"></i><i class="uc b"></i></div>
        <div class="info">
          <h2>UNO</h2>
          <p data-t="uno.desc"></p>
          <div class="chips"><span class="chip" data-t="uno.players"></span><span class="chip" data-t="uno.time"></span></div>
        </div>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="game-card mono" href="/monopoly/">
        <div class="art" aria-hidden="true">
          <div class="mini-board"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><b>$</b></div>
        </div>
        <div class="info">
          <h2>Monopoly</h2>
          <p data-t="mono.desc"></p>
          <div class="chips"><span class="chip" data-t="mono.players"></span><span class="chip" data-t="mono.time"></span></div>
        </div>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="game-card ludo" href="/ludo/">
        <div class="art" aria-hidden="true">
          <div class="mini-ludo"><i class="q r"></i><i class="q g"></i><i class="q y"></i><i class="q b"></i><b></b></div>
        </div>
        <div class="info">
          <h2>Ludo</h2>
          <p data-t="ludo.desc"></p>
          <div class="chips"><span class="chip" data-t="ludo.players"></span><span class="chip" data-t="ludo.time"></span></div>
        </div>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </section>

    <section class="panel home-panel">
      <h3 data-t="join.title"></h3>
      <form id="join-form" class="join-row">
        <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code">
        <button class="btn" type="submit" data-t="join.go"></button>
      </form>
      <div id="room-list" class="room-list"></div>
    </section>

    <section class="panel home-panel subtle">
      <h3 data-t="friends"></h3>
      <div id="addresses" class="addresses"><span class="muted" data-t="lookingUp"></span></div>
      <div id="hub-qr" class="qr hidden"><div class="qr-img"></div><p class="muted small" data-t="scan"></p></div>
    </section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="hub.js"></script>
</body>
</html>
