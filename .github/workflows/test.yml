name: tests

on:
  push:
  pull_request:

jobs:
  uno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uno
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
