<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecdc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>UNO Night</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='12' y='4' width='40' height='56' rx='6' fill='%23e5322d' stroke='white' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='13' ry='22' transform='rotate(30 32 32)' fill='white'/%3E%3Ctext x='32' y='40' font-size='22' font-weight='900' text-anchor='middle' fill='%23e5322d' font-family='Arial'%3E1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-color="none" data-screen="home">
  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen">
    <button class="btn ghost sm lang-btn home-lang" data-action="lang" data-i18n-title="title.language"></button>
    <div class="home">
      <div class="logo-wrap">
        <div class="logo-cards" aria-hidden="true"><i class="lc r"></i><i class="lc y"></i><i class="lc g"></i><i class="lc b"></i></div>
        <h1 class="logo">UNO<span>night</span></h1>
        <p class="tagline" data-i18n="home.tagline"></p>
      </div>

      <div class="panel home-panel">
        <label class="field">
          <span data-i18n="home.name"></span>
          <input id="name-input" maxlength="16" autocomplete="nickname" data-i18n-placeholder="home.namePh" spellcheck="false">
        </label>
        <button id="btn-create" class="btn primary big" data-i18n="home.create"></button>
        <div class="divider"><span data-i18n="home.or"></span></div>
        <form id="join-form" class="join-row">
          <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" data-i18n-aria="home.code">
          <button class="btn" type="submit" data-i18n="home.join"></button>
        </form>
        <div id="room-list" class="room-list"></div>
      </div>

      <div class="panel home-panel subtle">
        <h3 data-i18n="home.friendsFrom"></h3>
        <div id="home-addresses" class="addresses"><span class="muted" data-i18n="home.lookingUp"></span></div>
        <button class="btn ghost sm" data-action="rules" data-i18n="home.howTo"></button>
      </div>
    </div>
  </section>

  <!-- ============ LOBBY ============ -->
  <section id="screen-lobby" class="screen hidden">
    <header class="topbar">
      <button class="btn ghost sm" data-action="leave" data-i18n="top.leave"></button>
      <div class="room-code"><small data-i18n="top.room"></small><strong id="lobby-code">----</strong></div>
      <div class="tb-right">
        <button class="btn ghost sm lang-btn" data-action="lang" data-i18n-title="title.language"></button>
        <button class="btn ghost icon" data-action="rules" data-i18n-title="title.rules">?</button>
        <button class="btn ghost icon mute-btn" data-action="mute" data-i18n-title="title.sound"></button>
        <button class="btn ghost icon chat-btn" data-action="chat" data-i18n-title="title.chat">💬<span class="badge hidden"></span></button>
      </div>
    </header>
    <div class="lobby">
      <div class="panel">
        <h2><span data-i18n="lobby.players"></span> <span id="lobby-count" class="pill"></span></h2>
        <ul id="lobby-players" class="player-list"></ul>
        <button id="btn-add-bot" class="btn sm" data-i18n="lobby.addBot"></button>
      </div>
      <div class="panel">
        <h2><span data-i18n="lobby.rules"></span> <span id="rules-lock" class="pill muted"></span></h2>
        <form id="settings-form" class="settings" onsubmit="return false"></form>
      </div>
      <div class="panel">
        <h2 data-i18n="lobby.invite"></h2>
        <div id="lobby-qr" class="qr hidden">
          <div class="qr-img"></div>
          <p class="muted small" data-i18n="lobby.scan"></p>
        </div>
        <p class="muted small" data-i18n="lobby.inviteHint"></p>
        <div id="lobby-addresses" class="addresses"></div>
        <p class="muted small"><span data-i18n="lobby.orCode"></span> <b id="lobby-code-2"></b>.</p>
      </div>
    </div>
    <footer class="lobby-foot">
      <button id="btn-start" class="btn primary big" data-i18n="lobby.startGame"></button>
      <p id="lobby-wait" class="muted"></p>
    </footer>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen hidden">
    <header class="topbar">
      <button class="btn icon" data-action="menu" data-i18n-title="title.menu">☰</button>
      <div class="tb-mid">
        <span class="tb-code"><span data-i18n="game.room"></span> <b id="g-code"></b></span>
        <span id="g-round" class="tb-round"></span>
      </div>
      <div class="tb-right">
        <button class="btn icon" data-action="scores" data-i18n-title="title.scores">🏆</button>
        <button class="btn icon chat-btn" data-action="chat" data-i18n-title="title.chat">💬<span class="badge hidden"></span></button>
      </div>
    </header>
    <nav id="turn-strip" class="turn-strip" data-i18n-aria="strip.title"></nav>

    <div id="table" class="table">
      <div class="felt" aria-hidden="true"></div>
      <div id="opponents" class="opponents"></div>
      <div class="table-center">
        <div id="direction" class="direction" aria-hidden="true">
          <svg viewBox="0 0 200 200"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
            <circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9" opacity=".8"/>
            <g id="dir-arrows">
              <path d="M100 18 A82 82 0 0 1 182 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
              <path d="M100 182 A82 82 0 0 1 18 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
            </g>
          </svg>
        </div>
        <button id="draw-pile" class="pile draw" data-i18n-aria="pile.draw"></button>
        <div id="discard-pile" class="pile discard" data-i18n-aria="pile.discard"></div>
      </div>
      <div id="table-info" class="table-info"></div>
      <div id="status" class="status"></div>
      <aside id="leaderboard" class="leaderboard hidden" aria-live="polite"></aside>
      <button id="btn-uno" class="uno-fab hidden"></button>
    </div>

    <div class="me-bar">
      <div class="me-left">
        <button id="btn-sort" class="btn ghost sm" data-i18n-title="btn.sortTitle"></button>
      </div>
      <div id="me-info" class="me-info"></div>
      <div class="actions">
        <button id="btn-multi-cancel" class="btn ghost sm hidden" data-i18n-title="modal.cancel">✕</button>
        <button id="btn-multi" class="btn primary hidden"></button>
        <button id="btn-challenge" class="btn warn hidden" data-i18n="btn.challenge"></button>
        <button id="btn-draw" class="btn hidden"></button>
        <button id="btn-pass" class="btn hidden" data-i18n="btn.pass"></button>
      </div>
    </div>
    <div id="hand-wrap" class="hand-wrap"><div id="hand" class="hand"></div></div>
  </section>

  <!-- ============ CHAT DRAWER ============ -->
  <aside id="drawer" class="drawer" data-i18n-aria="drawer.chat">
    <div class="drawer-tabs">
      <button class="tab active" data-tab="chat" data-i18n="drawer.chat"></button>
      <button class="tab" data-tab="log" data-i18n="drawer.log"></button>
      <button class="btn ghost icon close" data-action="chat" data-i18n-title="drawer.close">✕</button>
    </div>
    <div id="chat-list" class="feed"></div>
    <div id="log-list" class="feed hidden"></div>
    <div id="reactions" class="reactions"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="240" data-i18n-placeholder="chat.placeholder" autocomplete="off">
      <button class="btn sm" type="submit" data-i18n="chat.send"></button>
    </form>
  </aside>

  <!-- ============ MODALS ============ -->
  <div id="modal-color" class="modal hidden" role="dialog" data-i18n-aria="modal.pickColor">
    <div class="modal-box small">
      <h2 data-i18n="modal.pickColor"></h2>
      <div class="color-grid">
        <button data-color="red" class="cbtn red"></button>
        <button data-color="yellow" class="cbtn yellow"></button>
        <button data-color="green" class="cbtn green"></button>
        <button data-color="blue" class="cbtn blue"></button>
      </div>
      <button class="btn ghost sm" data-close data-i18n="modal.cancel"></button>
    </div>
  </div>

  <div id="modal-target" class="modal hidden" role="dialog" data-i18n-aria="modal.swapWith">
    <div class="modal-box small">
      <h2 data-i18n="modal.swapWith"></h2>
      <div id="target-list" class="target-list"></div>
      <button class="btn ghost sm" data-close data-i18n="modal.cancel"></button>
    </div>
  </div>

  <div id="modal-results" class="modal hidden" role="dialog">
    <div class="modal-box">
      <div id="results-body"></div>
      <div id="results-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="modal-menu" class="modal hidden" role="dialog" data-i18n-aria="menu.title">
    <div class="modal-box small">
      <h2 data-i18n="menu.title"></h2>
      <div class="menu-list">
        <button class="btn" data-action="lang"><span class="lang-btn"></span></button>
        <button class="btn" data-action="rules" data-i18n="menu.rules"></button>
        <button class="btn mute-btn" data-action="mute"></button>
        <button class="btn" data-action="fx" id="btn-fx"></button>
        <button class="btn" data-action="fullscreen" data-i18n="menu.fullscreen"></button>
        <button class="btn" data-action="end-game" id="btn-end-game" data-i18n="menu.end"></button>
        <button class="btn danger" data-action="leave" data-i18n="menu.leave"></button>
      </div>
      <button class="btn ghost sm" data-close data-i18n="modal.close"></button>
    </div>
  </div>

  <div id="modal-rules" class="modal hidden" role="dialog" data-i18n-aria="rules.title">
    <div class="modal-box wide">
      <h2 data-i18n="rules.title"></h2>
      <div class="rules" data-i18n-html="rules.html"></div>
      <div class="modal-actions"><button class="btn primary" data-close data-i18n="rules.ok"></button></div>
    </div>
  </div>

  <div id="conn-banner" class="conn-banner hidden" data-i18n="conn.reconnecting"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
